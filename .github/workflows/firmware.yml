name: Firmware

on:
  push:
    branches:
      - mainline
      - build/step1
      - dashboard
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y make gcc-arm-none-eabi

      - name: Configure toolchain paths
        run: cp Makefile.posix SDK/17.1.0_ddde560/components/toolchain/gcc/Makefile.posix

      - name: Build
        run: |
          cp Makefile.nRF52 Makefile
          make -j4

      - name: Report size
        run: |
          arm-none-eabi-size _build/nrf52811_xxaa.out
          arm-none-eabi-nm --size-sort --radix=d _build/nrf52811_xxaa.out | tail -25

      - name: Package DFU zip
        run: |
          set -e
          VERSION=$(tr -d '[:space:]' < firmware-version.txt)
          python -m pip install "nrfutil==6.1.7"
          nrfutil pkg generate \
            --hw-version 52 \
            --sd-req 0x126 \
            --sd-id 0x126 \
            --application _build/nrf52811_xxaa.hex \
            --application-version "$VERSION" \
            --key-file tools/priv.pem \
            "epd-${VERSION}-ota.zip"
          ls -l "epd-${VERSION}-ota.zip"

      - name: Sanitize branch name
        run: echo "ARTIFACT=${GITHUB_REF_NAME//\//-}" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ env.ARTIFACT }}
          path: |
            _build/nrf52811_xxaa.hex
            epd-*-ota.zip


